<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Small Rooms">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Small Rooms</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, phone-first. Screens swap above a docked player and a bottom tab bar.
   Palette: London after dark — inky plum ground, sodium-lamp amber for venues/gigs, cool blue for "you". */
:root{
  --ink:#141019; --ink-2:#1c1723; --ink-3:#282131; --line:#372e41;
  --text:#f1eaf4; --muted:#aa9eb5; --faint:#6f6479;
  --lamp:#ffb547; --lamp-dim:#7d5620; --you:#7cc7ff; --you-dim:#29475f; --live:#ff6b5a; --new:#9be38a;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tabh:58px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:15px/1.45 var(--body)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:0 max(16px,env(safe-area-inset-left)) calc(var(--tabh) + var(--dockh,0px) + 24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
header.top{position:sticky;top:0;z-index:5;background:var(--ink);padding:calc(10px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink-3)}
header.top h1{font:700 21px/1 var(--display);margin:0;letter-spacing:-.01em}
header.top .back{font-size:22px;color:var(--muted);padding-right:4px}
header.top .sub{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
h2{font:700 18px/1.2 var(--display);margin:22px 0 8px;text-wrap:balance}
h2 small{display:block;font:400 12.5px var(--body);color:var(--muted);margin-top:3px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);background:var(--ink-2)}
.pill.on{border-color:var(--lamp);color:var(--text);background:#2b2115}
.pill.you{border-color:var(--you-dim);color:var(--you)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.scroller::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px}
.btn.primary{background:var(--lamp);color:#1b1206}
.btn.ghost{border:1px solid var(--line);color:var(--text)}
.btn.you{background:var(--you);color:#071521}
.card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:14px;padding:14px}
.callout{border-radius:14px;padding:14px;background:linear-gradient(180deg,#221a14,#1c1723);border:1px solid var(--lamp-dim)}
.callout.blue{background:linear-gradient(180deg,#142130,#1c1723);border-color:var(--you-dim)}

/* gig cards */
.gig{padding:12px 0 14px;border-bottom:1px solid var(--ink-3)}
.gig .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.gig .meta .v{color:var(--lamp);font-weight:600}
.gig h3{font:600 15.5px/1.3 var(--body);margin:4px 0 8px;text-wrap:balance}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px}
.badge.new{background:#1d3318;color:var(--new)}
.badge.you{background:#16293a;color:var(--you)}
.badge.going{background:#3a2616;color:var(--lamp)}
ol.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.acts li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px;align-items:center;min-height:40px;padding:0 6px;border-radius:8px}
ol.acts li .t{font:12px var(--mono);color:var(--faint)}
ol.acts li .n{min-width:0}
ol.acts li .n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.acts li .n i{display:block;font-style:normal;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.acts li.playing{background:var(--ink-3)}
ol.acts li.playing .t{color:var(--live)}
ol.acts li.nomusic b{color:var(--faint)}
ol.acts li.rec b{color:var(--you)}
.heart{width:36px;height:36px;display:grid;place-items:center;font-size:18px;color:var(--faint)}
.heart.on{color:var(--live)}
.play{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);font-size:12px}
.gig .foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gig .foot .btn{padding:8px 12px;font-size:13px;border-radius:10px}
.going-on{background:var(--lamp);color:#1b1206;border-color:var(--lamp)!important}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ink-3)}
.item img,.item .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--ink-3);display:grid;place-items:center;color:var(--faint);font:600 16px var(--display)}
.item .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venuepick{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.venuepick button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--ink-2)}
.venuepick button small{color:var(--muted)}
.progress{height:6px;background:var(--ink-3);border-radius:3px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--you)}

/* player dock */
#dock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:20;background:rgba(28,23,35,.98);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
#dock .inner{max-width:640px;margin:0 auto;padding:8px max(12px,env(safe-area-inset-left)) 8px max(12px,env(safe-area-inset-right))}
#yt{width:100%;aspect-ratio:16/9;min-height:200px;max-height:34vh;border-radius:10px;overflow:hidden;background:#000;margin-bottom:8px}
#yt iframe{width:100%;height:100%;border:0}
.np{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.np img{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--ink-3)}
.np .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .what{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ctl{display:flex;align-items:center;gap:2px}
.np .ctl button{width:38px;height:38px;display:grid;place-items:center;font-size:16px;border-radius:50%}
.np .ctl .pp{background:var(--text);color:var(--ink);font-size:14px}
.np .src{font-size:10.5px;color:var(--faint);margin-top:2px}
#am iframe{width:100%;height:175px;border:0;border-radius:10px;overflow:hidden;background:transparent}
#am .amhint{font-size:11.5px;color:var(--faint);margin:4px 2px 8px}
.mode{display:flex;gap:6px;margin-top:8px}
.mode button{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--muted)}
.mode button[aria-pressed="true"]{border-color:var(--lamp);color:var(--text);background:#2b2115}
.bar{height:3px;background:var(--ink-3);border-radius:2px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--live)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--ink);border-top:1px solid var(--ink-3);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--faint)}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--lamp)}
nav.tabs button .dot{position:absolute;margin:-18px 0 0 22px;width:8px;height:8px;border-radius:50%;background:var(--new)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--dockh,0px) + 16px + env(safe-area-inset-bottom));background:var(--text);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:30;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dock" hidden><div class="inner">
  <div id="yt" hidden><div id="ytplayer"></div></div>
  <div id="am" hidden><iframe id="amframe" title="Apple Music player" allow="autoplay *; encrypted-media *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe>
    <div class="amhint">Tap ▶ in Apple’s player. Signed in to Apple Music in this browser = full song, otherwise a preview. ⏭ when you’re ready.</div></div>
  <div class="np">
    <img id="npArt" alt="">
    <div style="min-width:0"><div class="who" id="npWho"></div><div class="what" id="npWhat"></div><div class="src" id="npSrc"></div></div>
    <div class="ctl">
      <button id="npHeart" class="heart" aria-label="Like this act">♡</button>
      <button id="npPrev" aria-label="Previous">⏮</button>
      <button id="npPlay" class="pp" aria-label="Play or pause">▶</button>
      <button id="npNext" aria-label="Next">⏭</button>
    </div>
  </div>
  <div class="bar"><i id="npBar"></i></div>
  <div class="mode" id="modeSwitch" role="group" aria-label="Playback"><button data-mode="full">Full songs · YouTube / Apple Music</button><button data-mode="preview">Previews · plays on, works locked</button></div>
  <div class="faint" style="font-size:11.5px;margin-top:6px">Locking your phone switches to previews so the music keeps going. <a id="ytQueue" hidden target="_blank" rel="noopener" style="color:var(--muted)"></a></div>
</div></div>
<nav class="tabs" aria-label="Sections"><div class="inner">
  <button data-tab="discover"><span>◉</span>Discover</button>
  <button data-tab="browse"><span>▦</span>Browse</button>
  <button data-tab="liked"><span>♥</span>Liked</button>
  <button data-tab="gigs"><span>★</span>My gigs</button>
</div></nav>
<audio id="audio" preload="none" playsinline></audio>

<script src="data.js"></script>
<script>
(() => {
const SR = window.SR;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V = Object.fromEntries(SR.venues.map(v => [v.key, v]));
const A = SR.acts;
const now = new Date();
const dayKey = iso => new Date(iso).toLocaleDateString('en-CA', {timeZone: 'Europe/London'});
const today = dayKey(now.toISOString());
const fmtDay = iso => { const d = dayKey(iso); return d === today ? 'Tonight' : new Date(iso).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Europe/London'}); };
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London'}) : '';
const GIGS = SR.gigs.filter(g => dayKey(g.start) >= today).sort((a, b) => a.start.localeCompare(b.start));
const gigById = Object.fromEntries(SR.gigs.map(g => [g.id, g]));

/* ---------------- your data (stays on this phone) ---------------- */
const KEY = 'smallrooms.v1';
let S = {likes: {}, going: {}, plays: {}, home: null, ring: 1, mode: 'full', lastVisit: null, prevVisit: null, seenWelcome: false};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
// Starter likes come from a private link (#likes=key,key,...): the part after # never leaves the phone,
// so the public site doesn't carry anyone's taste. A local build may also bundle them in data.js.
const seedFromHash = (location.hash.match(/likes=([^&]+)/) || [])[1];
if (seedFromHash) {
  decodeURIComponent(seedFromHash).split(',').forEach(k => { if (A[k] && !S.likes[k]) S.likes[k] = Date.now(); });
  S.seeded = true;
  history.replaceState(null, '', location.pathname);
} else if (!S.seeded && (SR.starterLikes || []).length) {
  SR.starterLikes.forEach(k => { if (A[k]) S.likes[k] = Date.now(); });
  S.seeded = true;
}
// "new since you were last here": remember the previous visit, then stamp this one
// a "visit" only rolls over after an hour away, so reloading doesn't wipe the NEW badges
if (!S.lastVisit) { S.prevVisit = new Date(Date.now() - 7 * 864e5).toISOString(); S.lastVisit = now.toISOString(); }
else if (now - new Date(S.lastVisit) > 3600e3) { S.prevVisit = S.lastVisit; S.lastVisit = now.toISOString(); }
save();
setInterval(() => { S.lastVisit = new Date().toISOString(); save(); }, 5 * 60e3);   // keep "last here" current while open

const liked = k => !!S.likes[k];
const playable = k => A[k] && A[k].songs && A[k].songs.length;
const isNew = g => g.seen && g.seen > S.prevVisit;

/* ---------------- geography: start at one venue, widen by distance ---------------- */
const hav = (a, b) => { const R = 6371, r = x => x * Math.PI / 180; const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  return 2 * R * Math.asin(Math.sqrt(Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2)); };
const byDistance = from => SR.venues.map(v => ({v, d: hav(from, v)})).sort((a, b) => a.d - b.d);
function circle() {
  if (!S.home || !V[S.home]) return [];
  return byDistance(V[S.home]).slice(0, Math.max(1, Math.min(SR.venues.length, S.ring))).map(x => x.v.key);
}
// the circle grows as you engage: every 3 likes or 12 acts listened to opens the next-nearest venue
// only what you do after picking a start venue counts (starter likes don't open venues by themselves)
const engagement = () => Math.max(0, Object.keys(S.likes).length - (S.base?.likes || 0))
  + Math.floor(Math.max(0, Object.keys(S.plays).length - (S.base?.plays || 0)) / 4);
const setHome = key => { S.home = key; S.ring = 1; S.base = {likes: Object.keys(S.likes).length, plays: Object.keys(S.plays).length}; save(); };
const earnedRing = () => 1 + Math.floor(engagement() / 3);
function maybeGrow() {
  const r = Math.min(SR.venues.length, earnedRing());
  if (S.home && r > S.ring) {
    S.ring = r; save();
    const added = circle()[S.ring - 1];
    if (added) toast(`Opened up ${V[added].name} in your discovery queue`);
  }
}

/* ---------------- taste: similar sounds to what you like ---------------- */
function tasteScores() {
  const L = Object.keys(S.likes).filter(k => A[k]);
  const sc = {};
  const tagCount = {};
  L.forEach(k => { if (A[k].tag) tagCount[A[k].tag] = (tagCount[A[k].tag] || 0) + 1; });
  for (const [k, a] of Object.entries(A)) {
    if (!playable(k)) continue;
    let s = 0;
    for (const l of L) {
      const fwd = (A[l].similar || []).find(x => x[0] === k);
      const back = (a.similar || []).find(x => x[0] === l);
      s += Math.max(fwd ? fwd[1] : 0, back ? back[1] : 0);
    }
    if (a.tag && tagCount[a.tag]) s += 0.25 * tagCount[a.tag] / Math.max(1, L.length) * 3;
    s += 0.06 * (a.score || 0);           // gentle prior: closeness to Radiohead / Tame Impala / Pinegrove
    sc[k] = s;
  }
  return sc;
}
const READY = 3;   // likes needed before band recommendations appear
function recommendedActs(n) {
  const sc = tasteScores();
  return Object.entries(sc).filter(([k]) => !liked(k) && A[k].gigs.some(id => gigById[id] && dayKey(gigById[id].start) >= today))
    .sort((a, b) => b[1] - a[1]).slice(0, n).map(([k, s]) => ({k, s}));
}
function gigScore(g, sc) {
  let s = 0;
  g.acts.forEach(a => { s += liked(a.k) ? 3 : (sc[a.k] || 0); });
  if (circle().includes(g.venue)) s += 0.3;
  return s;
}
function promoterScores(sc) {
  const out = {};
  GIGS.forEach(g => { if (g.promoter === 'In-house') return;
    const p = out[g.promoter] ||= {name: g.promoter, s: 0, gigs: [], liked: new Set()};
    p.gigs.push(g);
    g.acts.forEach(a => { p.s += liked(a.k) ? 2 : (sc[a.k] || 0) * 0.6; if (liked(a.k)) p.liked.add(A[a.k]?.name || a.n); });
  });
  return Object.values(out).sort((a, b) => b.s - a.s);
}

/* ---------------- player: YouTube full songs, or 30s previews (keep playing when locked) ---------------- */
const audio = $('#audio');
let Q = [], qi = -1, ytPlayer = null, ytReady = false, pendingYT = null, tick = null;
// iPhones pause YouTube when the screen locks. While the app is in the background ("away"),
// the queue carries on as 30s previews, which keep playing locked; full songs resume when you come back.
let away = false;
const mode = () => away ? 'preview' : S.mode;
function songFor(k, idx) {
  const songs = (A[k] && A[k].songs) || [];
  if (idx != null) return songs[idx];
  return mode() === 'full' ? (songs.find(s => s.youtube) || songs[0]) : (songs.find(s => s.preview) || songs[0]);
}
function setQueue(items, start = 0, label = '') {
  Q = items.filter(it => playable(it.k)); Q.label = label;
  if (!Q.length) { toast('No verified recordings here yet'); return; }
  playAt(Math.min(start, Q.length - 1));
}
function playAt(i) {
  qi = i; const it = Q[qi]; if (!it) return;
  const a = A[it.k], s = songFor(it.k, it.song);
  S.plays[it.k] = (S.plays[it.k] || 0) + 1; save(); maybeGrow();
  const g = it.gig && gigById[it.gig];
  $('#dock').hidden = false;
  $('#npWho').textContent = a.name;
  $('#npWhat').textContent = s.title + (g ? ` · ${fmtDay(g.start)}, ${V[g.venue].name}` : '');
  $('#npArt').src = s.artwork || ''; $('#npArt').style.visibility = s.artwork ? 'visible' : 'hidden';
  $('#npHeart').classList.toggle('on', liked(it.k)); $('#npHeart').textContent = liked(it.k) ? '♥' : '♡';
  if (away && !s.preview) return next();   // locked: only previews can play, skip songs without one
  const useYT = s.youtube && (mode() === 'full' || !s.preview);   // YouTube-only songs play either way (screen on)
  const amEmbed = !useYT && mode() === 'full' && s.apple_url && s.apple_id
    ? s.apple_url.replace('https://music.apple.com', 'https://embed.music.apple.com') + '?i=' + s.apple_id + '&theme=dark' : null;
  $('#npSrc').innerHTML = esc((useYT ? 'Full song · YouTube' : amEmbed ? 'Apple Music player' : s.preview ? '30s preview · ' + (s.spotify_url ? 'Spotify' : 'Apple Music') : 'No playable clip')
    + ` · ${qi + 1}/${Q.length}${Q.label ? ' · ' + Q.label : ''}`) + (openLinks(s) ? ' · Save in: ' + openLinks(s) : '');
  clearInterval(tick);
  $('#am').hidden = !amEmbed;
  if (!amEmbed && $('#amframe').src) $('#amframe').removeAttribute('src');
  if (useYT) {
    audio.pause(); $('#yt').hidden = false; loadYT(s.youtube);
  } else if (amEmbed) {
    // Apple's own player: full song for signed-in subscribers. It can't be controlled from here,
    // so it waits for a tap and the queue moves on when you press ⏭.
    audio.pause(); $('#yt').hidden = true; if (ytPlayer && ytReady) ytPlayer.stopVideo();
    $('#amframe').src = amEmbed;
  } else {
    $('#yt').hidden = true; if (ytPlayer && ytReady) ytPlayer.stopVideo();
    if (s.preview) { audio.src = s.preview; audio.play().catch(() => {}); }
    else return next();
  }
  mediaSession(a, s);
  syncDock(); renderPlaying(); updateYTLink();
  tick = setInterval(progress, 500);
}
// "Open in YouTube": the rest of the queue as a temporary playlist in the YouTube app
// (YouTube's app keeps playing with the screen locked for YouTube Premium members).
function updateYTLink() {
  const ids = [...new Set(Q.slice(Math.max(qi, 0)).map(it => (songFor(it.k, it.song) || {}).youtube || ((A[it.k].songs || []).find(s => s.youtube) || {}).youtube).filter(Boolean))].slice(0, 50);
  const l = $('#ytQueue');
  l.hidden = ids.length < 1;
  l.href = 'https://www.youtube.com/watch_videos?video_ids=' + ids.join(',');
  l.textContent = `Open the next ${ids.length} in YouTube ↗`;
}
// unlock the app's own audio player on the first tap, so it's allowed to take over when the phone locks
let primed = false;
document.addEventListener('click', () => {
  if (primed) return; primed = true;
  if (!audio.src) {

document.addEventListener('visibilitychange', () => {

    return `<li class="${m ? '' : 'nomusic'} ${rec ? 'rec' : ''}" data-q="${g.id}" data-i="${i}">

      <span class="n"><b>${esc(act ? act.name : a.n)}</b><i>${m ? esc(song.title) + (act.tag ? ' · ' + esc(act.tag) : '') : 'no verified recording'}</i></span>

  if (d.like) return toggleLike(d.like);
  if (d.going) return toggleGoing(d.going);
  if (d.play) { const g = gigById[d.play]; return setQueue(gigQueue(g), g.acts.slice(0, +d.i).filter(a => playable(a.k)).length, g.title); }
  if (d.playgig) { const g = gigById[d.playgig]; return setQueue(gigQueue(g), 0, V[g.venue].name); }
  if (d.playact) { const a = A[d.playact]; return setQueue(a.songs.map((s, i) => ({k: d.playact, song: i})), 0, a.name); }
  if (d.playsong) return setQueue(A[d.playsong].songs.map((s, i) => ({k: d.playsong, song: i})), +d.i, A[d.playsong].name);
  if (d.venue) return go({tab: 'browse', venue: d.venue});
  if (d.promoter) return go({tab: 'browse', promoter: d.promoter});
  if (d.sound) return go({tab: 'browse', sound: d.sound});
  if (d.by) return go({tab: 'browse', by: d.by});
  if (d.back != null) return go({tab: route.tab, by: route.by});
  if (d.shownew != null) return go({tab: 'discover', allNew: true});
  if (d.home) { setHome(d.home); toast(`Starting at ${V[d.home].name}`); return render(); }
  if (d.playlist) {
    const gs = d.playlist === 'venue' ? GIGS.filter(g => g.venue === route.venue) : d.playlist === 'promoter' ? GIGS.filter(g => g.promoter === route.promoter) : GIGS.filter(g => g.acts.some(a => A[a.k] && A[a.k].tag === route.sound));
    const items = d.playlist === 'sound' ? gs.flatMap(g => g.acts.filter(a => A[a.k] && A[a.k].tag === route.sound).map(a => ({k: a.k, gig: g.id}))) : gigsQueue(gs);
    return setQueue(items, 0, route.venue ? V[route.venue].name : route.promoter || route.sound);
  }
  if (t.id === 'playDiscover') return setQueue(discoveryQueue(), 0, 'discovery');
  if (t.id === 'changeHome') { S.home = null; save(); return render(); }
  if (t.id === 'growNow') { S.ring = Math.min(SR.venues.length, S.ring + 1); save(); return render(); }
  if (t.id === 'playLikes') {
    const L = Object.entries(S.likes).filter(([k]) => playable(k)).sort((a, b) => b[1] - a[1]).map(([k]) => k);
    const items = []; for (let i = 0; i < 5; i++) L.forEach(k => { if (A[k].songs[i]) items.push({k, song: i}); });
    return setQueue(items, 0, 'your likes');
  }
  if (t.id === 'locate') {
    if (!navigator.geolocation) return toast('Location isn’t available here, pick a venue instead');
    navigator.geolocation.getCurrentPosition(p => {
      const near = byDistance({lat: p.coords.latitude, lng: p.coords.longitude})[0];
      setHome(near.v.key); toast(`Nearest: ${near.v.name} (${near.d.toFixed(1)} km)`); render();
    }, () => toast('Couldn’t get your location, pick a venue instead'), {timeout: 8000});
  }
});
// Full songs (YouTube, screen on) vs Previews (30s clips that keep playing when the phone is locked)
function syncMode() {
  document.querySelectorAll('#modeSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
}
document.querySelectorAll('#modeSwitch button').forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode; save(); syncMode();
  toast(S.mode === 'full' ? 'Full songs where there’s a verified video' : 'Previews: keeps playing with your phone locked');
  if (Q[qi]) playAt(qi);
});
syncMode();
window.addEventListener('resize', syncDock);
render();
})();
</script>
